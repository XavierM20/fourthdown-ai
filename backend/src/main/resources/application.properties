spring.application.name=fourthdown-ai

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fourthdown}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fourthdown}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fourthdown_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA
# ============================================================

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ============================================================
# COLLEGE FOOTBALL DATA
# ============================================================

cfbd.base-url=${CFBD_BASE_URL:https://api.collegefootballdata.com}
cfbd.api-key=${CFBD_API_KEY}

# ============================================================
# ML SERVICE
# ============================================================

ml.base-url=${ML_BASE_URL:http://localhost:8000}

# ============================================================
# SERVER
# ============================================================

server.port=${PORT:8080}

spring.jpa.open-in-view=false

frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}


# =========================================================
# FourthDown AI automatic synchronization
# =========================================================

# Lightweight coordinator wakes every 5 minutes.
# It only calls CFBD aggressively when games are close to kickoff.
fourthdown.sync.coordinator-ms=${GAME_SYNC_COORDINATOR_MS:300000}

# First schedule check 30 seconds after backend startup.
fourthdown.sync.initial-delay-ms=30000

# Team metadata refreshes every 24 hours.
fourthdown.sync.teams-ms=${TEAM_SYNC_INTERVAL_MS:86400000}

# Wait 3 minutes after startup before the first metadata refresh.
fourthdown.sync.teams-initial-delay-ms=180000