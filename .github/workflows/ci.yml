name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fourthdown
          POSTGRES_USER: fourthdown
          POSTGRES_PASSWORD: fourthdown_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fourthdown -d fourthdown"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      CFBD_API_KEY: test-key
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fourthdown
      SPRING_DATASOURCE_USERNAME: fourthdown
      SPRING_DATASOURCE_PASSWORD: fourthdown_dev
      ML_BASE_URL: http://localhost:8000
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and build backend
        working-directory: backend
        run: mvn clean test package

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
